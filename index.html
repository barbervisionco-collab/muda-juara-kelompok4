  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"d705f3d2-b10b-44e6-8b07-c02c7ffbbd05\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <style>/* ==========================================================================\n   COLOR TOKENS — Rakamin Proposal Deck System\n   Source: 02-design-tokens.md §1. Locked values — do not introduce new hex.\n   ========================================================================== */\n\n:root {\n  /* Primary — Teal (brand identity color) */\n  --teal-900: #0F2440; /* deepest — dark panel / cover gradient end */\n  --teal-800: #006460; /* dark fills, header bands on dark cards, gradient start */\n  --teal-700: #00959F; /* CORE BRAND COLOR — titles, headers, primary fills, chart series 1 */\n  --teal-600: #01949E; /* secondary fills, card headers, alternate chart series */\n  --teal-500: #00AFA8; /* mid-tone card fills, secondary panels */\n  --teal-400: #00B1BD; /* lighter accents, hover / secondary states */\n  --teal-200: #89D6D1; /* light tint — tag fills, background washes */\n  --teal-100: #E6F6F4; /* pale tint — card backgrounds, subtle section backgrounds */\n\n  /* Secondary accent — Gold (emphasis only, never > 10% of slide area) */\n  --gold-500: #FFC000; /* badges, ratings, single callouts, bio nameplates */\n  --gold-700: #B8860B; /* rare darker gold, text-on-light emphasis only */\n\n  /* Neutrals */\n  --ink-900: #000000; /* pure emphasis text only */\n  --ink-800: #1F2937; /* primary body text */\n  --ink-600: #4B5563; /* secondary / caption text */\n  --ink-400: #94A3B8; /* disabled / tertiary text, gridlines */\n  --surface-white: #FFFFFF;\n  --surface-100: #F5F7FC; /* alternate light section background */\n  --surface-200: #F2F2F2; /* subtle card background on white */\n  --border-teal-tint: #D1E3E1; /* card borders, table borders */\n\n  /* Semantic / status */\n  --status-warn-bg: #FCE9DD; /* \"Teori\" / caution table-cell tags */\n  --status-positive: #00AFA8; /* = teal-500 */\n  --status-neutral: #94A3B8;\n\n  /* Chart series sequence (in order) */\n  --chart-1: var(--teal-700);\n  --chart-2: var(--teal-500);\n  --chart-3: var(--teal-400);\n  --chart-4: var(--teal-200);\n  --chart-5: var(--gold-500);\n  --chart-negative: var(--ink-400);\n\n  /* Semantic aliases */\n  --text-heading: var(--teal-700);\n  --text-body: var(--ink-800);\n  --text-caption: var(--ink-600);\n  --text-on-dark: var(--surface-white);\n  --surface-card-light: var(--surface-white);\n  --surface-card-dark: var(--teal-800);\n  --surface-page: var(--surface-white);\n  --surface-section-alt: var(--surface-100);\n  --border-default: var(--border-teal-tint);\n  --accent-emphasis: var(--gold-500);\n}\n\n/* Deprecated — never use. Kept only so a lint/search can flag stray legacy hex. */\n/* #7030A0 (stray purple) — forbidden. Any teal hex not listed above — forbidden. */\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   TYPOGRAPHY TOKENS — Rakamin Proposal Deck System\n   Source: 02-design-tokens.md §2, 07-writing-style.md\n   Font: Rubik. No local font binaries were supplied with the source brief —\n   loaded live from Google Fonts. See readme.md \"Fonts\" for details/ask.\n   ========================================================================== */\n\n/* arabic */\n@font-face {\n  font-family: 'Rubik';\n  font-style: italic;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"f6a51269-ef3f-4450-a11a-bb4cc30b921e\") format('woff2');\n  unicode-range: U+0600-06FF, U+0750-077F, U+0870-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC, U+102E0-102FB, U+10E60-10E7E, U+10EC2-10EC7, U+10EC9-10EEE, U+10EF0-10EFF, U+1EE00-1EE03, U+1EE05-1EE1F, U+1EE21-1EE22, U+1EE24, U+1EE27, U+1EE2  tags, KPI labels — often uppercase */\n  --type-stat-size: 32pt;         /* 28–36pt: big KPI numbers */\n\n  --line-height-title: 1.2;   /* 1.15–1.25 */\n  --line-height-body: 1.4;    /* 1.35–1.45 */\n\n  --letter-spacing-label: 0.03em;\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   SPACING, GRID & MEASUREMENT TOKENS — Rakamin Proposal Deck System\n   Source: 02-design-tokens.md §3, 03-grid-and-layout-system.md\n   Base unit = 0.1\" (all spacing is a multiple of this).\n   1 inch = 96px at standard web resolution — px equivalents given for HTML use.\n   ========================================================================== */\n\n:root {\n  --space-unit: 0.1in;         /* base unit */\n  --space-xs: 0.1in;           /* icon-to-label gaps, tight inline spacing */\n  --space-sm: 0.2in;           /* padding inside small tags/pills */\n  --space-md: 0.3in;           /* card internal padding, stacked-text gap */\n  --space-lg: 0.4in;           /* slide margin, gap between cards in a row */\n  --space-xl: 0.57in;          /* gap between header zone and content zone */\n\n  /* Resolved exact values */\n  --gap-logo-to-title: 0.15in;\n  --gap-subtitle-to-arrow: 0.3in;\n  --pad-table-cell: 0.15in;\n  --gap-card-icon-label: 0.1in;\n  --gap-card-heading-body: 0.2in;\n  --height-pill: 0.28in; /* @kind spacing */\n  --pad-pill-v: 0.06in;\n  --pad-pill-h: 0.15in;\n  --height-framework-band: 0.4in; /* @kind spacing */\n\n  /* Canvas & grid (10in x 5.625in, 16:9) */\n  --slide-width: 10in; /* @kind spacing */\n  --slide-height: 5.625in; /* @kind spacing */\n  --slide-margin: 0.4in;\n  --slide-margin-top-logo: 0.15in;\n  --header-zone-height: 1.05in; /* @kind spacing */\n  --footer-zone-start: 5.2in; /* @kind spacing */\n  --content-zone-width: 9.2in; /* @kind spacing */\n  --grid-column-count: 12; /* @kind other */\n  --grid-column-width: 0.767in; /* @kind spacing */\n  --grid-gutter: 0.4in; /* @kind spacing */\n\n  /* Icon circle sizes — exactly two valid values */\n  --icon-circle-inline: 0.5in; /* @kind spacing */\n  --icon-circle-standalone: 0.8in; /* @kind spacing */\n\n  /* Cover / Divider hero split */\n  --hero-text-fraction: 42%; /* @kind other */\n  --hero-image-fraction: 58%; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* ==========================================================================\n   RADIUS, SHADOW & EFFECT TOKENS — Rakamin Proposal Deck System\n   Source: 02-design-tokens.md §4–5, §5a\n   ========================================================================== */\n\n:root {\n  /* Radius */\n  --radius-sm: 0.06in;   /* tags, pills, small buttons */\n  --radius-md: 0.12in;   /* cards, tables, stat blocks */\n  --radius-lg: 0.25in;   /* large image panels, hero photo containers */\n  /* radius-blob is a freeform mask — see assets/blob-mask.svg, cover/divider only */\n\n  /* Elevation — cards on white/surface-100 use shadow-none (the default) */\n  --shadow-card: 0 0.03in 0.06in rgba(0, 0, 0, 0.15); /* only on photo/full-bleed backgrounds */\n  --shadow-none: none;\n\n  /* Bullet glyph */\n  --bullet-size: 0.05in;\n  --bullet-gap: 0.1in;\n  --bullet-color: var(--teal-700);\n\n  /* Gradient (Cover / Divider / Closing backgrounds ONLY — pre-rendered image in production,\n     this linear-gradient is the CSS-preview equivalent) */\n  --gradient-hero: linear-gradient(135deg, var(--teal-800) 0%, var(--teal-900) 100%);\n\n  /* DOCUMENTED DEVIATION from the source spec (which forbids gradients on any\n     shape except the hero background above) — added at explicit user request.\n     See readme.md \"Intentional additions / deviations\". Use sparingly. */\n  --gradient-card: linear-gradient(135deg, var(--teal-700) 0%, var(--teal-500) 100%);\n  --gradient-card-deep: linear-gradient(135deg, var(--teal-800) 0%, var(--teal-600) 100%);\n  --gradient-accent: linear-gradient(135deg, var(--gold-500) 0%, var(--gold-700) 100%);\n\n  /* Contrast minimums (reference only, enforced by design review) */\n  --contrast-min-body: 4.5; /* @kind other */\n  --contrast-min-large: 3; /* @kind other */\n}\n<\u002Fstyle>\n  <style>/* Rakamin Proposal Deck Design System — global stylesheet entry point.\n   Keep this file as @imports only; add new token files under tokens/. */\n\n/* ==========================================================================\n   COLOR TOKENS — Rakamin Proposal Deck System\n   Source: 02-design-tokens.md §1. Locked values — do not introduce new hex.\n   ========================================================================== */\n\n:root {\n  /* Primary — Teal (brand identity color) */\n  --teal-900: #0F2440; /* deepest — dark panel / cover gradient end */\n  --teal-800: #006460; /* dark fills, header bands on dark cards, gradient start */\n  --teal-700: #00959F; /* CORE BRAND COLOR — titles, headers, primary fills, chart series 1 */\n  --teal-600: #01949E; /* secondary fills, card headers, alternate chart series */\n  --teal-500: #00AFA8; /* mid-tone card fills, secondary panels */\n  --teal-400: #00B1BD; /* lighter accents, hover / secondary states */\n  --teal-200: #89D6D1; /* light tint — tag fills, background washes */\n  --teal-100: #E6F6F4; /* pale tint — card backgrounds, subtle section backgrounds */\n\n  /* Secondary accent — Gold (emphasis only, never > 10% of slide area) */\n  --gold-500: #FFC000; /* badges, ratings, single callouts, bio nameplates */\n  --gold-700: #B8860B; /* rare darker gold, text-on-light emphasis only */\n\n  /* Neutrals */\n  --ink-900: #000000; /* pure emphasis text only */\n  --ink-800: #1F2937; /* primary body text */\n  --ink-600: #4B5563; /* secondary / caption text */\n  --ink-400: #94A3B8; /* disabled / tertiary text, gridlines */\n  --surface-white: #FFFFFF;\n  --surface-100: #F5F7FC; /* alternate light section background */\n  --surface-200: #F2F2F2; /* subtle card background on white */\n  --border-teal-tint: #D1E3E1; /* card borders, table borders */\n\n  /* Semant ;         /* 28–36pt: big KPI numbers */\n\n  --line-height-title: 1.2;   /* 1.15–1.25 */\n  --line-height-body: 1.4;    /* 1.35–1.45 */\n\n  --letter-spacing-label: 0.03em;\n}\n\n/* ==========================================================================\n   SPACING, GRID & MEASUREMENT TOKENS — Rakamin Proposal Deck System\n   Source: 02-design-tokens.md §3, 03-grid-and-layout-system.md\n   Base unit = 0.1\" (all spacing is a multiple of this).\n   1 inch = 96px at standard web resolution — px equivalents given for HTML use.\n   ========================================================================== */\n\n:root {\n  --space-unit: 0.1in;         /* base unit */\n  --space-xs: 0.1in;           /* icon-to-label gaps, tight inline spacing */\n  --space-sm: 0.2in;           /* padding inside small tags/pills */\n  --space-md: 0.3in;           /* card internal padding, stacked-text gap */\n  --space-lg: 0.4in;           /* slide margin, gap between cards in a row */\n  --space-xl: 0.57in;          /* gap between header zone and content zone */\n\n  /* Resolved exact values */\n  --gap-logo-to-title: 0.15in;\n  --gap-subtitle-to-arrow: 0.3in;\n  --pad-table-cell: 0.15in;\n  --gap-card-icon-label: 0.1in;\n  --gap-card-heading-body: 0.2in;\n  --height-pill: 0.28in; /* @kind spacing */\n  --pad-pill-v: 0.06in;\n  --pad-pill-h: 0.15in;\n  --height-framework-band: 0.4in; /* @kind spacing */\n\n  /* Canvas & grid (10in x 5.625in, 16:9) */\n  --slide-width: 10in; /* @kind spacing */\n  --slide-height: 5.625in; /* @kind spacing */\n  --slide-margin: 0.4in;\n  --slide-margin-top-logo: 0.15in;\n  --header-zone-height: 1.05in; /* @kind spacing */\n  --footer-zone-start: 5.2in; /* @kind spacing */\n  --content-zone-width: 9.2in; /* @kind spacing */\n  --grid-column-count: 12; /* @kind other */\n  --grid-column-width: 0.767in; /* @kind spacing */\n  --grid-gutter: 0.4in; /* @kind spacing */\n\n  /* Icon circle sizes — exactly two valid values */\n  --icon-circle-inline: 0.5in; /* @kind spacing */\n  --icon-circle-standalone: 0.8in; /* @kind spacing */\n\n  /* Cover / Divider hero split */\n  --hero-text-fraction: 42%; /* @kind other */\n  --hero-image-fraction: 58%; /* @kind other */\n}\n\n/* ==========================================================================\n   RADIUS, SHADOW & EFFECT TOKENS — Rakamin Proposal Deck System\n   Source: 02-design-tokens.md §4–5, §5a\n   ========================================================================== */\n\n:root {\n  /* Radius */\n  --radius-sm: 0.06in;   /* tags, pills, small buttons */\n  --radius-md: 0.12in;   /* cards, tables, stat blocks */\n  --radius-lg: 0.25in;   /* large image panels, hero photo containers */\n  /* radius-blob is a freeform mask — see assets/blob-mask.svg, cover/divider only */\n\n  /* Elevation — cards on white/surface-100 use shadow-none (the default) */\n  --shadow-card: 0 0.03in 0.06in rgba(0, 0, 0, 0.15); /* only on photo/full-bleed backgrounds */\n  --shadow-none: none;\n\n  /* Bullet glyph */\n  --bullet-size: 0.05in;\n  --bullet-gap: 0.1in;\n  --bullet-color: var(--teal-700);\n\n  /* Gradient (Cover / Divider / Closing backgrounds ONLY — pre-rendered image in production,\n     this linear-gradient is the CSS-preview equivalent) */\n  --gradient-hero: linear-gradient(135deg, var(--teal-800) 0%, var(--teal-900) 100%);\n\n  /* DOCUMENTED DEVIATION from the source spec (which forbids gradients on any\n     shape except the hero background above) — added at explicit user request.\n     See readme.md \"Intentional additions / deviations\". Use sparingly. */\n  --gradient-card: linear-gradient(135deg, var(--teal-700) 0%, var(--teal-500) 100%);\n  --gradient-card-deep: linear-gradient(135deg, var(--teal-800) 0%, var(--teal-600) 100%);\n  --gradient-accent: linear-gradient(135deg, var(--gold-500) 0%, var(--gold-700) 100%);\n\n  /* Contrast minimums (reference only, enforced by design review) */\n  --contrast-min-body: 4.5; /* @kind other */\n  --contrast-min-large: 3; /* @kind other */\n}\n\n<\u002Fstyle>\n  <script src=\"c5b1ac23-bbfa-424c-ba32-27920d7dc9db\"><\u002Fscript>\n  <script src=\"0eb878d0-0cef-4b0a-9dfe-a6c0afd80665\"><\u002Fscript>\n  <script src=\"0e946a18-ab6b-4a9d-a822-eb3201c391bd\"><\u002Fscript>\n  <script src=\"dd59785c-4f2c-4e3d-849c-26b140d16e90\"><\u002Fscript>\n  <style>\n    html, body { margin: 0; height: 100%; background: #FFFFFF; }\n    * { box-sizing: border-box; }\n    a { color: var(--teal-700); }\n    a:hover { color: var(--teal-800); }\n    input, textarea, select, button { font-family: inherit; }\n    ::selection { background: var(--teal-200); }\n    @keyframes mjspin { to { transform: rotate(360deg); } }\n    @keyframes mjfade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"height: 100dvh; display: flex; flex-direction: column; font-family: var(--font-family); color: var(--ink-800); background: var(--surface-white); overflow: hidden;\">\n\n  <sc-if value=\"{{ booting }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; font-size: 15px; color: var(--ink-600); background: var(--surface-100);\">{{ bootMsg }}<\u002Fdiv>\n  <\u002Fsc-if>\n  <sc-if value=\"{{ needLogin }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"flex: 1; overflow-y: auto; background: var(--surface-100); display: flex; align-items: center; justify-content: center; padding: 24px 16px;\">\n      <div style=\"width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 24px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <div style=\"display: flex; align-items: center; gap: 16px;\">\n            <img src=\"data:image/webp;base64,UklGRl5WAABXRUJQVlA4WAoAAAAwAAAA7wAA2AAASUNDUMgBAAAAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAA Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    data: null, auth: null, view: 'home', sid: null, tab: 'materi', drawer: false, q: '',\n    w: typeof window !== 'undefined' ? window.innerWidth : 1280,\n    user: { read: {}, tasks: {}, notes: {}, hls: [] },\n    edit: false, taskForm: null, wiz: null, gen: null, toast: null, sel: null, tocSheet: false, menuOpen: false, tocActive: null,\n    rec: null, tx: null, audio: null,\n    login: { mode: 'masuk', name: '', email: '', pass: '', err: '', info: '', busy: false }, booted: false, loadErr: null\n  };\n  mainRef = React.createRef();\n  frameRef = React.createRef();\n  audioRef = React.createRef();\n  wizAudioRef = React.createRef();\n  syncAudio() { [[this.audioRef, this._aWant], [this.wizAudioRef, this._wWant]].forEach(([r, u]) => { const el = r.current; if (el && u && el.getAttribute('src') !== u) el.setAttribute('src', u); }); }\n\n  componentDidMount() {\n    this._rs = () => this.setState({ w: window.innerWidth });\n    window.addEventListener('resize', this._rs);\n    this._sc = () => this.onSelChange();\n    document.addEventListener('selectionchange', this._sc);\n    const boot = async () => {\n      if (!window.MJAPI) return void setTimeout(boot, 40);\n      let ui = {}; try { ui = JSON.parse(localStorage.getItem('mj.ui')) || {}; } catch (e) {}\n      let auth = null; try { auth = await window.MJAPI.getAuth(); } catch (e) {}\n      this.setState({ booted: true, auth });\n      if (auth) await this.loadAll(auth, ui);\n    };\n    boot();\n  }\n  async loadAll(auth, ui) {\n    try {\n      let data = await window.MJAPI.loadData();\n      if (!data && auth.role === 'admin') {\n        data = { program: { title: 'Muda Juara' }, weeks: [{ id: 'w' + this.uid(), title: 'Minggu pertama', days: [] }], days: [], sessions: {} };\n        await window.MJAPI.createProgram(data);\n      }\n      if (!data) data = { program: { title: 'Program belum disiapkan admin' }, weeks: [], days: [], sessions: {} };\n      const user = (await window.MJAPI.loadUser()) || {};\n      ui = ui || {}; const okSid = ui.sid && data.sessions[ui.sid];\n      this.setState({ data, loadErr: null, user: { read: {}, tasks: {}, notes: {}, hls: [], ...user }, view: ui.view === 'session' && !okSid ? 'home' : (ui.view || 'home'), sid: okSid ? ui.sid : null, tab: ui.tab || 'materi' });\n    } catch (e) { this.setState({ loadErr: 'Gagal memuat data. Periksa koneksi lalu muat ulang halaman.' }); }\n  }\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._rs);\n    document.removeEventListener('selectionchange', this._sc);\n    clearInterval(this._genT);\n  }\n  componentDidUpdate(pp, ps) {\n    const s = this.state;\n    this.mountFrame();\n    this.syncAudio();\n    if (s.view === 'session' && s.sid && (!s.audio || s.audio.sid !== s.sid) && this._audLoading !== s.sid) {\n      const sid = s.sid; this._audLoading = sid;\n      const done = url => { if (this.state.audio && this.state.audio.url) URL.revokeObjectURL(this.state.audio.url); this._audLoading = null; this.setState({ audio: { sid, url } }); };\n      this.idbGet(sid).then(b => done(b ? URL.createObjectURL(b) : null)).catch(() => done(null));\n    }\n    if (ps.view !== s.view || ps.sid !== s.sid || ps.tab !== s.tab) {\n      try { localStorage.setItem('mj.ui', JSON.stringify({ view: s.view === 'new' ? 'home' : s.view, sid: s.sid, tab: s.tab })); } catch (e) {}\n    }\n  }\n\n  // helpers\n  fmt(s, short) { if (!s) return ''; const M = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des']; const [y, m, d] = s.split('-').map(Number); return short ? `${d} ${M[m - 1]}` : `${d} ${M[m - 1]} ${y}`; }\n  dleft(s) { if (!s) return 99; const t = new Date(); t.setHours(0, 0, 0, 0); const [y, m, d] = s.split('-').map(Number); return Math.round((new Date(y, m - 1, d) - t) / 86400000); }\n  dlabel(n) { return n === 0 ? 'Hari ini' : n === 1 ? 'Besok' : n > 0 ? `${n} hari lagi` : `Lewat ${-n} hari`; }\n  uid() { return Math.random().toString(36).slice(2, 9); }\n  paras(t) { return (t || '').split(/\\n\\s*\\n/).map(x => x.trim()).filter(Boolean); }\n  addDays(s, n) { const d = s ? new Date(s + 'T00:00:00') : new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }\n  today() { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }\n  toast(msg) { clearTimeout(this._tt); this.setState({ toast: msg }); this._tt = setTimeout(() => this.setState({ toast: null }), 3200); }\n  spinner() { return React.createElement('span', { style: { width: 18, height: 18, borderRadius: '50%', border: '2.5px solid var(--teal-100)', borderTopColor: 'var(--teal-700)', display: 'block', animation: 'mjspin 0.8s linear infinite' } }); }\n\n  segs(text, marks) {\n    const r = [];\n    const lower = text.toLowerCase();\n    marks.forEach(m => { if (!m) return; const i = lower.indexOf(m.toLowerCase()); if (i >= 0) r.push([i, i + m.length]); });\n    if (!r.length) return [{ text, bg: 'transparent' }];\n    r.sort((a, b) => a[0] - b[0]);\n    const merged = [];\n    r.forEach(x => { const l = merged[merged.length - 1]; if (l && x[0] <= l[1]) l[1] = Math.max(l[1], x[1]); else merged.push([...x]); });\n    const out = []; let p = 0;\n    merged.forEach(([a, b]) => { if (a > p) out.push({ text: text.slice(p, a), bg: 'transparent' }); out.push({ text: text.slice(a, b), bg: 'var(--teal-200)' }); p = b; });\n    if (p < text.length) out.push({ text: text.slice(p), bg: 'transparent' });\n    return out;\n  }\n\n  struct(d) {\n    const dayMap = {}; d.days.forEach(x => { dayMap[x.id] = x; });\n    let dn = 0;\n    const weeks = d.weeks.map((wk, wi) => ({ ...wk, no: wi + 1, dayObjs: wk.days.map(id => dayMap[id]).filter(Boolean).map(day => ({ ...day, no: ++dn, weekId: wk.id, weekNo: wi + 1 })) }));\n    return { dayMap, weeks };\n  }\n\n  // persistence\n  saveData(data) {\n    this.setState({ data });\n    clearTimeout(this._sv);\n    this._sv = setTimeout(() => { window.MJAPI.saveData(data).catch(e => { console.error('save', e); this.toast('Gagal menyimpan ke server: ' + ((e && e.message) || 'periksa koneksi')); }); }, 600);\n  }\n  upd(fn) { const d = JSON.parse(JSON.stringify(this.state.data)); fn(d); this.saveData(d); }\n  setUser(fn) {\n    this.setState(s => { const user = JSON.parse(JSON.stringify(s.user)); fn(user); clearTimeout(this._su); this._su = setTimeout(() => window.MJAPI.saveUser(user).catch(() => {}), 800); return { user }; });\n  }\n\n  // navigation\n  go(view, extra) {\n    if (view !== 'new' && this.rec) this.stopRec(true);\n    this.setState({ view, drawer: false, edit: false, taskForm: null, tocSheet: false, menuOpen: false, sel: null, tocActive: null, ...(extra || {}) }, () => { if (this.mainRef.current) this.mainRef.current.scrollTop = 0; });\n  }\n  openSession(id, tab) { this.go('session', { sid: id, tab: tab || 'materi' }); }\n  scrollToId(id) {\n    const m = this.mainRef.current, el = document.getElementById(id);\n    this.setState({ tocSheet: false });\n    if (!m || !el) return;\n    m.scrollTo({ top: el.getBoundingClientRect().top - m.getBoundingClientRect().top + m.scrollTop - 70, behavior: 'smooth' });\n  }\n  onMainScroll() {\n    if (this.state.view !== 'session' || this.state.tab !== 'materi') return;\n    if (this._raf) return;\n    this._raf = requestAnimationFrame(() => {\n      this._raf = null;\n      const m = this.mainRef.current; if (!m) return;\n      const ids = this.tocIds || []; const top = m.getBoundingClientRect().top;\n      let act = ids[0];\n      ids.forEach(id => { const el = document.getElementById(id); if (el && el.getBoundingClientRect().top - top < 140) act = id; });\n      if (act !== this.state.tocActive) this.setState({ tocActive: act });\n    });\n  }\n\n  // selection / highlights\n  onSelChange() {\n    if (this.state.sel && this.state.sel.noting) return;\n    clearTimeout(this._selT);\n    this._selT = setTimeout(() => {\n      const s = window.getSelection(); const txt = s ? s.toString().replace(/\\s+/g, ' ').trim() : '';\n      const zoneOf = n => { const el = n && (n.nodeType === 1 ? n : n.parentElement); return el && el.closest ? el.closest('[data-hl]') : null; };\n      const z1 = s && zoneOf(s.anchorNode), z2 = s && zoneOf(s.focusNode);\n      if (!txt || txt.length < 3 || !z1 || z1 !== z2) { if (this.state.sel && !this.state.sel.noting) this.setState({ sel: null }); return; }\n      this.setState({ sel: { text: txt, noting: false, note: '' } });\n    }, 220);\n  }\n  saveHl() {\n    const sel = this.state.sel; if (!sel) return;\n    const sid = this.state.sid;\n    this.setUser(u => { u.hls = u.hls || []; u.hls.push({ id: this.uid(), sid, text: sel.text, note: sel.note || '', at: Date.now() }); });\n    try { window.getSelection().removeAllRanges(); } catch (e) {}\n    this.setState({ sel: null });\n    this.toast('Highlight tersimpan');\n  }\n\n  // editor actions\n  startWizard(dayId) {\n    const d = this.state.data; const { weeks } = this.struct(d);\n    const all = weeks.flatMap(w => w.dayObjs);\n    const day = all.find(x => x.id === dayId) || all[all.length - 1];\n    this.go('new', { wiz: { step: 1, dayId: day ? day.id : '', title: '', speaker: '', role: '', duration: '', transcript: '', images: [], taskText: '', err: '', src: 'rec', audio: null, quality: 'cepat', answer: '', guide: !localStorage.getItem('mj.guideSeen'), media: false }, gen: null, rec: null, tx: null });\n  }\n  wset(k, v) { this.setState(s => ({ wiz: { ...s.wiz, [k]: v, err: '' } })); }\n  readImg(file) {\n    return new Promise((res, rej) => {\n      const r = new FileReader();\n      r.onload = () => {\n        const img = new Image();\n        img.onload = () => {\n          const k = Math.min(1, 1280 / Math.max(img.width, img.height));\n          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);\n          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n          res({ id: this.uid(), name: file.name, url: c.toDataURL('image/jpeg', 0.8) });\n        };\n        img.onerror = rej; img.src = r.result;\n      };\n      r.onerror = rej; r.readAsDataURL(file);\n    });\n  }\n  async addImages(files) {\n    const list = Array.from(files || []).filter(f => /^image\\//.test(f.type)).sort((a, b) => a.lastModified - b.lastModified || a.name.localeCompare(b.name));\n    if (!list.length) return;\n    const imgs = [];\n    for (const f of list) { try { imgs.push(await this.readImg(f)); } catch (e) {} }\n    this.setState(s => { const all = [...s.wiz.images, ...imgs].slice(0, 20); return { wiz: { ...s.wiz, images: all, err: all.length < s.wiz.images.length + imgs.length ? 'Maksimal 20 foto. Sisanya tidak dimasukkan.' : '' } }; });\n  }\n  parseTranscript(txt) {\n    const blocks = txt.split(/\\n\\s*\\n/).map(x => x.trim()).filter(Boolean);\n    const src = blocks.length > 1 ? blocks : txt.split(/\\n/).map(x => x.trim()).filter(Boolean);\n    return src.map(b => { const m = b.match(/^\\[?(\\d{1,2}:\\d{2}(?::\\d{2})?)\\]?\\s*[-–:]?\\s*/); return m ? { t: m[1], text: b.slice(m[0].length) } : { t: '', text: b }; });\n  }\n  parseJSON(t) {\n    let s = String(t || '').replace(/```json|```/g, '');\n    const a = s.indexOf('{'), b = s.lastIndexOf('}');\n    if (a < 0 || b < 0) throw new Error('no json');\n    return JSON.parse(s.slice(a, b + 1));\n  }\n  buildPrompt(wz) {\n    const N = wz.images.length;\n    return `Kamu adalah penyusun modul belajar. Ubah transkrip kelas${N ? ' dan foto slide terlampir' : ''} menjadi modul belajar berbahasa Indonesia yang rapi, akurat, dan enak dibaca ulang. Jangan menambahkan fakta yang tidak ada di bahan.\n\nInfo sesi:\nJudul dari admin (boleh kosong): ${wz.title || '-'}\nPembicara: ${wz.speaker || '-'} (${wz.role || '-'})\nJumlah foto slide terlampir: ${N}${N ? ' (urut sesuai nama file slide-01 sampai slide-' + String(N).padStart(2, '0') + ')' : ''}\nCatatan tugas dari admin: ${wz.taskText || '-'}\n\nTRANSKRIP REKAMAN:\n\"\"\"\n${wz.transcript.trim() || '(tidak ada transkrip, gunakan isi slide)'}\n\"\"\"\n\nBalas HANYA dengan satu blok JSON valid, tanpa teks lain, persis dengan bentuk ini:\n{\"title\":\"judul sesi berupa pernyataan 3-8 kata, huruf kapital hanya di awal\",\"speaker\":\"nama pembicara\",\"role\":\"peran/jabatan pembicara\",\"summary\":\"ringkasan 3-5 kalimat tentang inti sesi\",\"topics\":[{\"title\":\"judul topik\",\"body\":\"penjelasan 2-3 paragraf yang komprehensif, paragraf dipisah \\\\n\\\\n\",\"slides\":[nomor slide terkait],\"blocks\":[blok visual, lihat di bawah]}],\"slides\":[{\"title\":\"judul slide\",\"explanation\":\"penjelasan isi slide 2-3 kalimat, gabungkan dengan konteks dari transkrip\"}],\"tasks\":[{\"title\":\"judul tugas\",\"instructions\":\"instruksi jelas\",\"deliverables\":[\"yang dikumpulkan\"],\"deadlineDays\":7}]}\nAturan: 3-6 topik sesuai alur materi. \"slides\" berisi tepat ${N} item sesuai urutan foto. \"tasks\" hanya jika tugas disebut di transkrip atau catatan admin, jika tidak ada isi []. deadlineDays = perkiraan jumlah hari dari tanggal sesi ke tenggat (default 7).`;\n  }\n  async generate() {\n    if (this.rec) this.stopRec(false);\n    if (this.state.tx && (this.state.tx.status === 'loading' || this.state.tx.status === 'running')) { this.toast('Tunggu transkrip selesai dulu'); return; }\n    const wz = this.state.wiz;\n    if (!wz.transcript.trim() && !wz.images.length) { this.setState({ wiz: { ...wz, step: 2, err: 'Tambahkan transkrip atau minimal satu foto slide.' } }); return; }\n    this.setState({ wiz: { ...wz, step: 3, err: '', prompt: this.buildPrompt(wz), answer: wz.answer || '', copied: false } });\n    if (this.mainRef.current) this.mainRef.current.scrollTop = 0;\n  }\n  async copyPrompt() {\n    const p = this.state.wiz.prompt || '';\n    try { await navigator.clipboard.writeText(p); this.setState(s => ({ wiz: { ...s.wiz, copied: true } })); this.toast('Prompt disalin'); }\n    catch (e) { this.toast('Tidak bisa menyalin otomatis. Tekan lama kotak teks di bawah, lalu salin.'); }\n  }\n  downloadSlides() {\n    this.state.wiz.images.forEach((im, i) => setTimeout(() => { const a = document.createElement('a'); a.href = im.url; a.download = `slide-${String(i + 1).padStart(2, '0')}.jpg`; document.body.appendChild(a); a.click(); a.remove(); }, i * 350));\n  }\n  uiVals({ isMobile, weeks, d, readN, pubN, pct, openTasks, doneTasks, hls }) {\n    const days = weeks.flatMap(w => w.dayObjs || []);\n    const dates = days.map(x => x.date).filter(Boolean).sort();\n    const f = s => { try { return new Date(s + 'T00:00:00').toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }); } catch (e) { return s; } };\n    const nT = openTasks.length + doneTasks.length;\n    const now = this.today();\n    const curWeek = weeks.find(w => (w.dayObjs || []).some(x => x.date >= now)) || weeks[weeks.length - 1];\n    return {\n      shellPad: isMobile ? '0' : '16px', sbRadius: isMobile ? '0' : '22px', mainRadius: isMobile ? '0' : '22px',\n      cardBorder: isMobile ? '0' : '1px solid var(--border-teal-tint)',\n      heroRadius: isMobile ? '20px' : '24px', heroPad: isMobile ? '26px 20px' : 'clamp(28px, 4vw, 48px)',\n      heroCols: isMobile ? 'minmax(0, 1fr)' : 'minmax(0, 1.5fr) minmax(280px, 1fr)',\n      homePad: isMobile ? '16px 14px 80px' : '24px 24px 80px',\n      eyebrow: curWeek ? `Minggu ${curWeek.no}` : 'Program',\n      unread: Math.max(0, pubN - readN), openTasks: openTasks.length, tasksDone: `${doneTasks.length}/${nT}`,\n      stats: [\n        { label: 'Modul terbit', value: pubN, sub: `dari ${Object.keys(d.sessions).length} sesi`, desc: 'Sesi yang sudah bisa dibaca peserta.', dot: 'var(--surface-white)' },\n        { label: 'Sudah dibaca', value: readN, sub: pct + '%', desc: 'Modul yang sudah kamu tandai selesai dibaca.', dot: 'var(--teal-200)' },\n        { label: 'Tugas aktif',
